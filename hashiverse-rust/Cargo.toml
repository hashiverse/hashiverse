[workspace]
members = [
    "hashiverse-lib",
    "hashiverse-server-lib",
    "hashiverse-server",
    "hashiverse-client-wasm",
    "hashiverse-client-python",
    "hashiverse-client-nodejs",
    "hashiverse-client-rust",
    "hashiverse-integration-tests",
]
# Workspace-wide `cargo build` / `cargo test` / `cargo nextest run` only touches host-buildable
# crates. The wasm/python/nodejs extension crates are still members (for cargo metadata, publish,
# and explicit -p / --workspace invocations) but are skipped by the default selection — their
# deps (wasm-bindgen, pyo3 extension-module, napi) don't link against the host target.
default-members = [
    "hashiverse-lib",
    "hashiverse-server-lib",
    "hashiverse-server",
    "hashiverse-client-rust",
]
# Vendored fork of moka (see 3rdparty/moka/PATCH_NOTES.md). Excluded so cargo
# treats it only as a [patch.crates-io] source, not a workspace member.
exclude = ["3rdparty/moka"]

# Require newer resolver so features are handled per-package
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["James Jardine <mail@jimme.net>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hashiverse/hashiverse"
homepage = "https://www.hashiverse.com"

# Workspace-wide dependencies (can be inherited by members)
[workspace.lints.clippy]
module_inception = "allow"
collapsible_match = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }  # Tell the linter that we are happy with tokio_unstable being used as a condition name.

[workspace.dependencies]
anyhow = "1.0.102"
log = "0.4.29"
bytes = { version = "1.11.1", features = ["serde"] }
digest = "0.11.3"
scopeguard = "1.2.0"
hex = "0.4.3"
parking_lot = "0.12.5"
async-trait = "0.1.89"

# Internal workspace members published to crates.io. The `version` constraint here
# is the single source of truth: the CI action
# `.github/actions/set-cargo-version-from-tag` rewrites it to match the release
# tag alongside [workspace.package].version, and every member references the
# crate via `{ workspace = true }` so the constraint never has to be repeated.
hashiverse-lib = { path = "hashiverse-lib", version = "0.0.0" }
hashiverse-server-lib = { path = "hashiverse-server-lib", version = "0.0.0" }

# Temporary: depend on the vendored fork of moka that adds the `ExternalClock`
# seam, so the cache's native TTL/TTI/expiry run on our `TimeProvider` (scaled
# clock in tests). Drop this once the upstream PR is released. See
# 3rdparty/moka/PATCH_NOTES.md.
[patch.crates-io]
moka = { path = "3rdparty/moka" }

# Make sure our dependencies always use the release-level optimisations
[profile.dev.package."*"]
opt-level = 3

# Required by cargo-bolero for coverage-guided fuzzing with libFuzzer
[profile.fuzz]
inherits = "dev"

# For use with samply / perf / other sampling profilers.  Release-level optimisations
# with debug symbols kept so stack frames resolve, and debug-assertions kept on so
# `config::TESTING` (and thus POW_REDUCTION_FACTOR / CLOCK_LENIENCE_FACTOR) stays
# true in dependent crates that don't see cfg(test).
[profile.profiling]
inherits = "release"
debug = true
debug-assertions = true
strip = false

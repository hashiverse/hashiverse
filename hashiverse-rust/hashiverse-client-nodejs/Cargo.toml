[package]
name = "hashiverse-client-nodejs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository = "https://github.com/hashiverse/hashiverse/tree/main/hashiverse-rust/hashiverse-client-nodejs"
description = "Native Node.js binding for the Hashiverse client — your open-source decentralized X/Twitter replacement."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hashiverse-lib = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi9", "async", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
bytes = { workspace = true }
hex = { workspace = true }
shellexpand = "3"
rustls = { version = "0.23", features = ["ring"] }

[build-dependencies]
napi-build = "2"

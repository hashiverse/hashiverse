[package]
name = "hashiverse-client-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
repository = "https://github.com/hashiverse/hashiverse/tree/main/hashiverse-rust/hashiverse-client-wasm"
description = "This library provides the rust/wasm backend for the associated hashiverse-client-web repo."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
hashiverse-lib = { workspace = true, features = ["generic-tests"] }
wasm-bindgen-test = "0.3.71"

[dependencies]
# The browser trait-impls (WasmClientStorage, WasmTransportFactory, WasmKeyLocker,
# WasmParallelPowGenerator, WasmBootstrapProvider) now live in hashiverse-lib and are
# available automatically on the wasm32-unknown-unknown target. This crate keeps only
# the thin #[wasm_bindgen] JS surface (hashiverse_client_wasm, wasm_try) on top of them.
hashiverse-lib = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
console_error_panic_hook = { version = "0.1.6", optional = true }
console_log = { version = "1.0.0", features = ["color"] }
fern = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
hex = { workspace = true }
js-sys = "0.3.85"
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.6", features = ["js"] }

# Only the `Worker` handle type is used here now (init_pow_workers receives ready Workers
# from TypeScript). The crypto/channel/fetch web-sys surface moved to hashiverse-lib.
[dependencies.web-sys]
version = "0.3"
features = [
    "Worker",
]


[package]
name = "hashiverse-client-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/hashiverse/hashiverse/tree/main/hashiverse-rust/hashiverse-client-wasm"
description = "This library provides the rust/wasm backend for the associated hashiverse-client-web repo."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
hashiverse-lib = { path = "../hashiverse-lib", features = ["generic-tests"] }
wasm-bindgen-test = "*"

[dependencies]
hashiverse-lib = { path = "../hashiverse-lib" }
anyhow = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
console_error_panic_hook = { version = "0.1.6", optional = true }
console_log = { version = "1.0.0", features = ["color"] }
tokio = { version = "1.45", features = ["macros", "time", "rt"] }
tokio-util = { version = "0.7.14", features = ["codec", "rt"] }
gloo-net = "0.6.0"
fern = "0.7.1"
indexed_db_futures = { version = "0.6.4", features = ["serde", "cursors", "indices"] }
serde = { version = "1.0.228", features = ["derive"] }
hex = { workspace = true }
js-sys = "0.3.85"
base64 = "0.22.1"
async-trait = "0.1.89"
send_wrapper = { version = "0.6.0", features = ["futures"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1"
tsify = { version = "0.5.6", features = ["js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    'Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'Window', 'Blob', 'SubtleCrypto', 'Crypto', 'CryptoKey',
    'Worker', 'WorkerOptions', 'WorkerType', 'BlobPropertyBag', 'Url', 'MessageEvent', 'Navigator', 'WorkerGlobalScope',
    'MessageChannel', 'MessagePort',
]


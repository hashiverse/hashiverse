[package]
name = "hashiverse-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core protocol library for Hashiverse — your open-source decentralized X/Twitter replacement."
readme = "README.md"
keywords = ["hashiverse", "p2p", "decentralized", "social-media", "social"]
categories = ["network-programming", "cryptography", "wasm"]

[lints]
workspace = true

[features]
generic-tests = []

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
digest = { workspace = true }
scopeguard = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }


ed25519-dalek = {  version = "2.1.1" , features = ["rand_core", "serde", "pkcs8"] }
num-traits = "0.2.19"
strum_macros = "0.27.2"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
chrono = "0.4.44"
tokio = { version = "1.45", features = ["macros", "time", "rt", "io-util"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
clap = { version = "4.6.1", features = ["derive"] }
base64 = "0.22.1"
uuid = { version = "1.17.0", features = ["v4"] }
lz4_flex="0.13.1"
brotli="8.0.2"
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
derive_more = "0.99.20"
serde_with = { version = "3.16.1", features = ["hex"] }
blake2 = "0.11.0-rc.6"
blake3 = { version = "1.8.5" }
sha2 = "0.11.0"
sha3 = "0.12.0"
whirlpool = "0.11.0"
groestl = "0.11.0"
skein = "0.2.0"
send_wrapper = { version = "0.6.0", features = ["futures"]}
tempfile = "3.25.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry", "fmt"] }
ml-dsa = "0.1"
falcon-rust = "0.1.2"
bitflags="2.11.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moka = { version = "0.12", features = ["sync"] }
rayon = "1.10"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.36", features = ["bundled"] }
dirs-next = "2.0"
hickory-resolver = { version = "0.25", features = ["https-ring", "dnssec-ring", "webpki-roots"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.4.0", features = ["futures"] }
uuid = { version = "1.17.0", features = ["js"] }
getrandom_2 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom_3 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom_4 = { package = "getrandom", version = "0.4.2", features = ["wasm_js"] }

[target.'cfg(all(tokio_unstable, not(target_arch = "wasm32")))'.dependencies]
console-subscriber = { version = "0.5.0" }

[dev-dependencies]
wasm-bindgen-test = "0.3.71"
bolero = "0.11"

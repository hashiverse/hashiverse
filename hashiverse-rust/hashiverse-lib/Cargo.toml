[package]
name = "hashiverse-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core protocol library for Hashiverse — your open-source decentralized X/Twitter replacement."
readme = "README.md"
keywords = ["hashiverse", "p2p", "decentralized", "social-media", "social"]
categories = ["network-programming", "cryptography", "wasm"]

[lints]
workspace = true

[features]
generic-tests = []

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
digest = { workspace = true }
scopeguard = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"


ed25519-dalek = { version = "3.0.0", features = ["serde", "pkcs8", "alloc"] }
num-traits = "0.2.19"
strum_macros = "0.28.0"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
chrono = "0.4.44"
tokio = { version = "1.45", features = ["macros", "time", "rt", "io-util"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
clap = { version = "4.6.1", features = ["derive"] }
base64 = "0.23.1"
uuid = { version = "1.17.0", features = ["v4"] }
lz4_flex = "0.14.0"
brotli = "9.1.1"
scraper = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
derive_more = { version = "2.1.1", features = ["display", "add", "mul", "not"] }
serde_with = { version = "3.16.1", features = ["hex"] }
blake2 = "0.11.0"
blake3 = { version = "1.8.7" }
sha2 = "0.11.1"
sha3 = "0.12.0"
whirlpool = "0.11.0"
groestl = "0.11.0"
skein = "0.2.0"
send_wrapper = { version = "0.6.0", features = ["futures"]}
tempfile = "3.25.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry", "fmt"] }
ml-dsa = "0.1"
falcon-rust = "0.3.1"
bitflags="2.11.1"
getrandom_4 = { package = "getrandom", version = "0.4.2" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moka = { version = "0.12", features = ["sync"] }
rayon = "1.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
hickory-resolver = { version = "0.26", features = ["https-aws-lc-rs", "dnssec-aws-lc-rs", "webpki-roots"] }
# Cert-chain validation (server-side ownership-proof verification only). Pulls in `aws-lc-rs`,
# which needs a C toolchain and does not build for wasm — kept off the wasm target so
# `cert_validation` and its deps never reach the browser client. See tools/mod.rs gate.
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "aws-lc-rs"] }
webpki-roots = "1.0"
rustls-pki-types = "1.13"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.4.0", features = ["futures"] }
uuid = { version = "1.17.0", features = ["js"] }
getrandom_4 = { package = "getrandom", version = "0.4.2", features = ["wasm_js"] }
# Browser-only trait impls relocated from hashiverse-client-wasm (WasmClientStorage,
# WasmTransportFactory, WasmKeyLocker, WasmParallelPowGenerator, WasmBootstrapProvider).
# Gated to the wasm32-unknown-unknown target, mirroring how native-impl deps sit in the
# cfg(not(target_arch = "wasm32")) table — so an external browser consumer gets them via
# `cargo add hashiverse-lib` targeting wasm32-unknown-unknown.
wasm-bindgen = "0.2.108"
js-sys = "0.3.85"
gloo-net = "0.7.0"
indexed_db_futures = { version = "0.6.4", features = ["serde", "cursors", "indices"] }
web-sys = { version = "0.3", features = [
    "Window", "WorkerGlobalScope", "Crypto", "CryptoKey", "SubtleCrypto",
    "Worker", "MessageChannel", "MessagePort", "MessageEvent",
] }

[target.'cfg(all(tokio_unstable, not(target_arch = "wasm32")))'.dependencies]
console-subscriber = { version = "0.5.0" }

[dev-dependencies]
wasm-bindgen-test = "0.3.71"
bolero = "0.13"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# bolero 0.13 -> rand 0.9 -> getrandom 0.3, which needs `wasm_js` to compile for wasm32-unknown-unknown.
# Test-only: keeps getrandom 0.3 out of the shipped browser bundle.
getrandom_3 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

[package]
name = "hashiverse-client-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "hashiverse_client"
crate-type = ["cdylib"]

[dependencies]
hashiverse-lib = { workspace = true }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
pyo3-log = "0.13"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
anyhow = { workspace = true }
log = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
shellexpand = "3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "logging", "std"] }

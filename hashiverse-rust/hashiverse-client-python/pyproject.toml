[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hashiverse-client"
version = "1.0.0"
description = "Python client for the Hashiverse decentralized social network"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "hashiverse_client._native"

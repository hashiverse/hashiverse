name: Set Cargo workspace version from release tag
description: |
  When the calling workflow is triggered by a release event, rewrites the
  [workspace.package] version in hashiverse-rust/Cargo.toml from the release
  tag (leading "v" stripped). No-op for non-release triggers.

  Tag format must be valid Cargo SemVer: v1.0.5 (stable), v1.0.5-rc1 /
  v1.0.5-beta.2 (pre-release with hyphen). Avoid v1.0.5rc1 (PEP 440 only).

runs:
  using: composite
  steps:
    - name: Set Cargo workspace version from release tag
      if: github.event_name == 'release'
      shell: bash
      run: |
        tag="${{ github.event.release.tag_name }}"
        version="${tag#v}"
        file=hashiverse-rust/Cargo.toml
        sed -E '/^\[workspace\.package\]/,/^\[/{s/^version = "[^"]*"/version = "'"$version"'"/}' "$file" > "$file.new"
        mv "$file.new" "$file"
        echo "--- workspace.package after rewrite ---"
        sed -n '/^\[workspace\.package\]/,/^\[/p' "$file"

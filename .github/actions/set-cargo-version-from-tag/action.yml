name: Set Cargo workspace version from release tag
description: |
  When the calling workflow is triggered by a release event, rewrites the
  workspace version in hashiverse-rust/Cargo.toml from the release tag
  (leading "v" stripped). No-op for non-release triggers.

  Two places get rewritten so they stay in lock-step:

  1. [workspace.package] `version` — what published crates are tagged with.
  2. Every line in [workspace.dependencies] of the form
     `name = { path = "...", version = "..." }` — the version constraint that
     members reference via `{ workspace = true }`. Convention: write `path`
     before `version` so the single-pass regex below catches it.

  Tag format must be valid Cargo SemVer: v1.0.5 (stable), v1.0.5-rc1 /
  v1.0.5-beta.2 (pre-release with hyphen). Avoid v1.0.5rc1 (PEP 440 only).

runs:
  using: composite
  steps:
    - name: Set Cargo workspace version from release tag
      if: github.event_name == 'release'
      shell: bash
      run: |
        tag="${{ github.event.release.tag_name }}"
        version="${tag#v}"
        file=hashiverse-rust/Cargo.toml

        # Pass 1: [workspace.package] version
        sed -E '/^\[workspace\.package\]/,/^\[/ s/^version = "[^"]*"/version = "'"$version"'"/' "$file" > "$file.new"
        mv "$file.new" "$file"

        # Pass 2: internal workspace path-deps in [workspace.dependencies]
        # Matches lines like:  hashiverse-lib = { path = "hashiverse-lib", version = "0.0.0" }
        # Constrained to lines that have BOTH `path = "..."` AND `version = "..."` so
        # external crate entries with only a `version` (e.g. bytes) are left untouched.
        sed -E '/^[A-Za-z0-9_-]+ = \{[^}]*path = "[^"]*"[^}]*version = "[^"]*"/ s/(version = ")[^"]*(")/\1'"$version"'\2/' "$file" > "$file.new"
        mv "$file.new" "$file"

        echo "--- workspace.package after rewrite ---"
        sed -n '/^\[workspace\.package\]/,/^\[/p' "$file"
        echo "--- workspace.dependencies (internal path-deps) ---"
        grep -E '^[A-Za-z0-9_-]+ = \{[^}]*path = ' "$file" || true

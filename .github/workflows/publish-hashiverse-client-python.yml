name: publish-hashiverse-client-python

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        required: true
        default: "testpypi"
        options:
          - testpypi
          - pypi

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_DIR: hashiverse-rust/hashiverse-client-python

jobs:
  build-wheels:
    name: build-wheels (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - runner: macos-latest
            target: x86_64
            manylinux: ""
            cross: true
          - runner: macos-latest
            target: aarch64
            manylinux: ""
          - runner: windows-latest
            target: x64
            manylinux: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/set-cargo-version-from-tag

      - uses: ./.github/actions/install-rust-toolchain

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
          rust-toolchain: ${{ env.RUST_CHANNEL }}

      - name: Smoke-test wheel
        if: ${{ !matrix.platform.cross }}
        shell: bash
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist --force-reinstall hashiverse-client
          python -c "from hashiverse_client import HashiverseClient, Post, Bio; print('import ok')"

      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: ${{ env.PACKAGE_DIR }}/dist/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: build-wheels
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hashiverse-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true

  publish-pypi:
    name: publish to PyPI
    needs: build-wheels
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hashiverse-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true

  verify-published-pypi:
    name: Smoke-install from PyPI
    needs: publish-pypi
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Rewrites hashiverse-rust/Cargo.toml on the runner so we can read the
      # tag-derived version (no-op on workflow_dispatch).
      - uses: ./.github/actions/set-cargo-version-from-tag

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install + import published version
        shell: bash
        run: |
          # Read Cargo SemVer, convert to PEP 440 (1.0.6-rc1 -> 1.0.6rc1, etc.)
          # to match maturin's normalization of the wheel filename on PyPI.
          cargo_version=$(sed -nE '/^\[workspace\.package\]/,/^\[/{ s/^version = "([^"]+)"/\1/p; }' hashiverse-rust/Cargo.toml | head -1)
          pep440_version=$(echo "$cargo_version" | sed -E 's/-rc\.?([0-9]+)/rc\1/; s/-beta\.?([0-9]+)/b\1/; s/-alpha\.?([0-9]+)/a\1/')
          echo "Verifying hashiverse-client==$pep440_version (from cargo $cargo_version)"

          scratch=$(mktemp -d)
          cd "$scratch"
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --quiet --upgrade pip

          # Retry briefly — PyPI propagation can lag a few seconds.
          for i in 1 2 3 4 5; do
            if pip install --pre "hashiverse-client==$pep440_version"; then
              break
            fi
            echo "install attempt $i failed, retrying..."
            sleep 5
          done

          python - <<'PY'
          from importlib.metadata import version
          from hashiverse_client import (
              HashiverseClient,
              HashiverseError,
              convert_text_to_hashiverse_html_x_hashtag,
          )
          assert callable(HashiverseClient), "HashiverseClient missing"
          assert issubclass(HashiverseError, Exception)
          out = convert_text_to_hashiverse_html_x_hashtag("RuStLang")
          assert 'hashtag="rustlang"' in out, f"helper broken: {out}"
          print(f"ok: imported hashiverse-client=={version('hashiverse-client')} from PyPI")
          PY

name: publish-hashiverse-client-python

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        required: true
        default: "testpypi"
        options:
          - testpypi

env:
  CARGO_TERM_COLOR: always
  PACKAGE_DIR: hashiverse-rust/hashiverse-client-python

jobs:
  build-wheels:
    name: build-wheels (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - runner: macos-latest
            target: x86_64
            manylinux: ""
            cross: true
          - runner: macos-latest
            target: aarch64
            manylinux: ""
          - runner: windows-latest
            target: x64
            manylinux: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
          rust-toolchain: nightly

      - name: Smoke-test wheel
        if: ${{ !matrix.platform.cross }}
        shell: bash
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist --force-reinstall hashiverse-client
          python -c "from hashiverse_client import HashiverseClient, Post, Bio; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: ${{ env.PACKAGE_DIR }}/dist/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: build-wheels
    if: ${{ inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hashiverse-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true

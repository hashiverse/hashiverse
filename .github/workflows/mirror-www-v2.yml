name: mirror-www-v2

# Pushes the built www site from hashiverse/www (GitHub Pages canonical) into
# the Bunny Edge Storage zone "hashiverse-www", which is then served from the
# www-eu and www-ch Pull Zones at www.hashiverse.{eu,ch}.
#
# Runs in parallel to the v1 mirror-www.yml during cutover. After ~1 week of
# clean operation, the v1 workflow is removed.

on:
  workflow_run:
    workflows: ["build-www"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Clone canonical dist
        run: git clone --branch main --depth 1 https://github.com/hashiverse/www.git dist

      # Drop forge-only files before sync. bunny-transfer has no exclude
      # mechanism, so we prune the working tree instead. README.md is the
      # autogenerated "this repo is regenerated" warning written by build-www;
      # .domains and CNAME are forge-specific config (Codeberg / GitHub Pages).
      - name: Drop forge-only files from dist
        run: rm -rf dist/.git dist/README.md dist/.domains dist/CNAME

      # bunny-transfer is a community npm CLI built specifically for Bunny
      # Edge Storage. Its `sync` subcommand uploads new/changed files and
      # deletes orphans, comparing by SHA256. We use it because Bunny's FTP
      # server doesn't honor MFMT (SetModTime errors) and drops mid-transfer
      # with FTP 426; Bunny's own docs steer users to the HTTP API for these
      # reasons. bunny-transfer authenticates with the account-wide API key.
      - name: Sync dist to Bunny storage zone
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          npx --yes bunny-transfer sync ./dist hashiverse-www \
            --access-key "$BUNNY_API_KEY"

      - name: Purge EU pull zone cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          curl -fsS -X POST \
            -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/${{ vars.BUNNY_PULL_ZONE_ID_WWW_EU }}/purgeCache"

      - name: Purge CH pull zone cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          curl -fsS -X POST \
            -H "AccessKey: $BUNNY_API_KEY" \
            "https://api.bunny.net/pullzone/${{ vars.BUNNY_PULL_ZONE_ID_WWW_CH }}/purgeCache"

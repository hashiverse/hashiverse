name: mirror-hashiverse

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # Clone from GitHub BEFORE setting up ssh-agent. webfactory/ssh-agent
      # parses the loaded SSH key's comment and installs git `insteadOf`
      # rules; if the key's comment happens to mention github.com it
      # rewrites our HTTPS clone into an SSH connection to the wrong host.
      # Doing the GitHub clone first sidesteps the rewrite entirely.
      - name: Clone from GitHub
        run: git clone --mirror https://github.com/hashiverse/hashiverse.git mirror

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CODEBERG_SSH_KEY_HASHIVERSE }}

      - name: Trust codeberg.org host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

      - name: Configure SSH keepalive for codeberg.org
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host codeberg.org
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Push to Codeberg (with retry)
        env:
          REPO: git@codeberg.org:hashiverse/hashiverse.git
        run: |
          cd mirror
          for attempt in 1 2 3; do
            if git push --prune "$REPO" \
                 "+refs/heads/*:refs/heads/*" \
                 "+refs/tags/*:refs/tags/*"; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; sleeping 30s." >&2
            sleep 30
          done
          echo "Push failed after 3 attempts." >&2
          exit 1

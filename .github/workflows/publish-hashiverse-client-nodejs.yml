name: publish-hashiverse-client-nodejs

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        required: true
        default: "dry-run"
        options:
          - dry-run
          - npm

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_DIR: hashiverse-rust/hashiverse-client-nodejs

jobs:
  build:
    name: build (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/set-cargo-version-from-tag

      - uses: ./.github/actions/set-npm-version-from-tag
        with:
          working-directory: ${{ env.PACKAGE_DIR }}

      - uses: ./.github/actions/install-rust-toolchain
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: npm ci
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm ci

      - name: napi build
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npx napi build --platform --release --target ${{ matrix.settings.target }}

      - name: Smoke test (native-host only)
        if: ${{ !matrix.settings.cross }}
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm test

      - uses: actions/upload-artifact@v5
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.PACKAGE_DIR }}/*.node
          if-no-files-found: error

  publish-dry-run:
    name: npm publish --dry-run (all packages)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'dry-run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/set-cargo-version-from-tag

      - uses: ./.github/actions/set-npm-version-from-tag
        with:
          working-directory: ${{ env.PACKAGE_DIR }}

      - uses: ./.github/actions/install-rust-toolchain
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"

      - name: npm ci
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm ci

      # Build on this runner purely for the side effect of generating index.js +
      # index.d.ts. The resulting host .node is discarded — per-target .node files
      # for the sibling packages come from the matrix via download-artifact +
      # napi artifacts below. Without this step, the root tarball's "files":
      # ["index.js", "index.d.ts"] whitelist points at files that don't exist
      # and npm publish silently ships an empty root (see 1.0.6 incident).
      - name: napi build (regenerate index.js + index.d.ts from current source)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npx napi build --platform --release --target x86_64-unknown-linux-gnu

      - uses: actions/download-artifact@v5
        with:
          path: ${{ env.PACKAGE_DIR }}/artifacts

      - name: napi create-npm-dirs (scaffold npm/<target>/ from package.json targets)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npx napi create-npm-dirs

      - name: napi artifacts + prepublish
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          npx napi artifacts
          npx napi prepublish --no-gh-release --skip-optional-publish

      - name: Assert root publish artefacts exist
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          test -f index.js   || { echo "missing index.js";   exit 1; }
          test -f index.d.ts || { echo "missing index.d.ts"; exit 1; }

      - name: Dry-run publish all packages
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          for dir in npm/*/ .; do
            echo "--- dry-run publish $dir ---"
            (cd "$dir" && npm publish --access public --dry-run)
          done

  publish:
    name: publish all packages (OIDC + provenance)
    needs: build
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'npm')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@hashiverse/hashiverse-client-nodejs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/set-cargo-version-from-tag

      - uses: ./.github/actions/set-npm-version-from-tag
        with:
          working-directory: ${{ env.PACKAGE_DIR }}

      - uses: ./.github/actions/install-rust-toolchain
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"

      - name: npm ci
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm ci

      # Build on this runner purely for the side effect of generating index.js +
      # index.d.ts. The resulting host .node is discarded — per-target .node files
      # for the sibling packages come from the matrix via download-artifact +
      # napi artifacts below. Without this step, the root tarball's "files":
      # ["index.js", "index.d.ts"] whitelist points at files that don't exist
      # and npm publish silently ships an empty root (see 1.0.6 incident).
      - name: napi build (regenerate index.js + index.d.ts from current source)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npx napi build --platform --release --target x86_64-unknown-linux-gnu

      - uses: actions/download-artifact@v5
        with:
          path: ${{ env.PACKAGE_DIR }}/artifacts

      - name: napi create-npm-dirs (scaffold npm/<target>/ from package.json targets)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npx napi create-npm-dirs

      - name: napi artifacts (move .node files into npm/<target>/)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npx napi artifacts

      - name: napi prepublish (rewrite root optionalDependencies)
        working-directory: ${{ env.PACKAGE_DIR }}
        # --no-gh-release: don't upload .node files as GitHub release assets (npm subpackages are the distribution channel).
        # --skip-optional-publish: don't let napi run `npm publish` for the per-target subpackages — the loop below handles that with --provenance and the right --tag for prereleases.
        run: npx napi prepublish --no-gh-release --skip-optional-publish

      - name: Assert root publish artefacts exist
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          test -f index.js   || { echo "missing index.js";   exit 1; }
          test -f index.d.ts || { echo "missing index.d.ts"; exit 1; }

      - name: Publish all packages (platforms first, then root)
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag_flag=""
          if [[ "$version" == *-* ]]; then
            echo "Prerelease version $version -> --tag next"
            tag_flag="--tag next"
          fi
          for dir in npm/*/; do
            echo "--- publishing $dir ---"
            (cd "$dir" && npm publish --access public --provenance $tag_flag)
          done
          echo "--- publishing root ---"
          npm publish --access public --provenance $tag_flag

  verify-published:
    name: Smoke-install from npm
    needs: publish
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'npm')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/set-npm-version-from-tag
        with:
          working-directory: ${{ env.PACKAGE_DIR }}

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install + import published version
        shell: bash
        run: |
          version=$(node -p "require('./${{ env.PACKAGE_DIR }}/package.json').version")
          echo "Verifying @hashiverse/hashiverse-client-nodejs@$version"
          scratch=$(mktemp -d)
          cd "$scratch"
          npm init -y >/dev/null
          # Retry briefly — registry propagation can lag a few seconds.
          for i in 1 2 3 4 5; do
            if npm install "@hashiverse/hashiverse-client-nodejs@$version" --no-audit --no-fund; then
              break
            fi
            echo "install attempt $i failed, retrying..."
            sleep 5
          done
          node --input-type=module -e "
            import { HashiverseClient, convertTextToHashiverseHtmlXHashtag } from '@hashiverse/hashiverse-client-nodejs';
            if (typeof HashiverseClient !== 'function') throw new Error('HashiverseClient missing');
            const out = convertTextToHashiverseHtmlXHashtag('RuStLang');
            if (!out.includes('hashtag=\"rustlang\"')) throw new Error('helper broken: ' + out);
            console.log('ok: imported ' + '$version' + ' from npm');
          "

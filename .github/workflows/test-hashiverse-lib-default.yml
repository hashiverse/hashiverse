name: test-hashiverse-lib-default

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "hashiverse-rust/hashiverse-lib/**"
  pull_request:
    branches: ["main"]
    paths:
      - "hashiverse-rust/hashiverse-lib/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hashiverse-rust
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target
      - uses: taiki-e/install-action@nextest
      # `--profile profiling` (release optimisations + debug_assertions=on) keeps
      # `config::TESTING` true, so `POW_REDUCTION_FACTOR = 16` stays in effect and
      # PoW-bound tests don't hang for hours. Plain `--release` makes TESTING false
      # in the dep view (e.g. doctests) and PoW reverts to full production strength.
      - name: Run tests
        run: cargo nextest run --cargo-profile profiling -p hashiverse-lib

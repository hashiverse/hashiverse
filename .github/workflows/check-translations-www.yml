name: check-translations-www

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "www/src/pages/**"
      - "www/src/i18n/**"
      - "www/translations/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Run staleness checker
        run: node www/translations/check-translations.mjs

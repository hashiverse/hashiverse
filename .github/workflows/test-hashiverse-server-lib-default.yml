name: test-hashiverse-server-lib-default

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "hashiverse-rust/hashiverse-lib/**"
      - "hashiverse-rust/hashiverse-server-lib/**"
  pull_request:
    branches: ["main"]
    paths:
      - "hashiverse-rust/hashiverse-lib/**"
      - "hashiverse-rust/hashiverse-server-lib/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hashiverse-rust
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target
      - uses: taiki-e/install-action@nextest
      # `--profile profiling` (release optimisations + debug_assertions=on) keeps
      # `config::TESTING` true inside the `hashiverse-lib` dependency, so PoW thresholds
      # stay at test-scaled values. Plain `--release` makes `SERVER_KEY_POW_MIN = Pow(32)`
      # in the dep and `peer_stats::*` tests would hang for ~5 hours generating a server id.
      - name: Run tests
        run: cargo nextest run --cargo-profile profiling -p hashiverse-server-lib

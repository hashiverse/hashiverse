name: mirror-app

on:
  workflow_run:
    workflows: ["build-app"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        target:
          - { repo: app-eu, domain: app.hashiverse.eu }
          - { repo: app-ch, domain: app.hashiverse.ch }
    steps:
      # Clone from GitHub BEFORE setting up ssh-agent. webfactory/ssh-agent
      # parses the loaded SSH key's comment and installs git `insteadOf`
      # rules; if the key's comment happens to mention github.com it
      # rewrites our HTTPS clone into an SSH connection to the wrong host.
      # Doing the GitHub clones first sidesteps the rewrite entirely.
      - name: Clone from GitHub (mirror)
        run: git clone --mirror https://github.com/hashiverse/app.git mirror

      - name: Clone from GitHub (work, for pages branch)
        run: git clone --branch main --depth 1 https://github.com/hashiverse/app.git work

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CODEBERG_SSH_KEY_APP }}

      - name: Trust codeberg.org host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

      - name: Configure SSH keepalive for codeberg.org
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host codeberg.org
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Push branches and tags to Codeberg (with retry)
        env:
          REPO: git@codeberg.org:hashiverse/${{ matrix.target.repo }}.git
        run: |
          cd mirror
          for attempt in 1 2 3; do
            if git push --prune "$REPO" \
                 "+refs/heads/*:refs/heads/*" \
                 "+refs/tags/*:refs/tags/*"; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; sleeping 30s." >&2
            sleep 30
          done
          echo "Push failed after 3 attempts." >&2
          exit 1

      - name: Build pages branch with .domains and push (with retry)
        env:
          REPO: git@codeberg.org:hashiverse/${{ matrix.target.repo }}.git
          DOMAIN: ${{ matrix.target.domain }}
        run: |
          cd work
          git config user.name "hashiverse-mirror"
          git config user.email "mirror@hashiverse.com"
          echo "$DOMAIN" > .domains
          git add .domains
          git commit -m "Add .domains for Codeberg Pages ($DOMAIN)"
          for attempt in 1 2 3; do
            if git push --force "$REPO" HEAD:refs/heads/pages; then
              echo "Pages push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Pages push attempt $attempt failed; sleeping 30s." >&2
            sleep 30
          done
          echo "Pages push failed after 3 attempts." >&2
          exit 1

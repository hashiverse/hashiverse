name: mirror-www

on:
  workflow_run:
    workflows: ["build-www"]
    types: [completed]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CODEBERG_SSH_KEY_WWW }}

      - name: Trust codeberg.org host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

      - name: Mirror to Codeberg
        run: |
          git clone --mirror https://github.com/hashiverse/www.git mirror
          git -C mirror push --mirror git@codeberg.org:hashiverse/www.git

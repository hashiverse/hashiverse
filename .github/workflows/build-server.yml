name: build-server

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: hashiverse/hashiverse-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/set-cargo-version-from-tag

      # --- Build binary ---

      - uses: ./.github/actions/install-rust-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust"
          workspaces: hashiverse-rust -> target

      - name: Build server binary
        working-directory: hashiverse-rust
        run: cargo build --release -p hashiverse-server

      # --- Build and push Docker image ---

      - name: Copy binary next to Dockerfile
        run: cp hashiverse-rust/target/release/hashiverse-server docker/hashiverse-server

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

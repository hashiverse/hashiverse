name: build-app

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/set-cargo-version-from-tag

      - uses: ./.github/actions/set-npm-version-from-tag

      - uses: ./.github/actions/install-rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "hashiverse-rust-wasm"
          workspaces: hashiverse-rust -> target

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM client
        working-directory: hashiverse-rust
        run: wasm-pack build hashiverse-client-wasm --release --target bundler

      - name: Install packages
        working-directory: hashiverse-client-web
        run: npm install

      - name: Build
        working-directory: hashiverse-client-web
        env:
          PRERELEASE_TAG: ${{ github.event.release.prerelease && github.event.release.tag_name || '' }}
        run: npm run build

      - name: Add README to dist
        run: |
          cat > hashiverse-client-web/dist/README.md << 'EOF'
          > [!WARNING]
          > This repository is automatically generated from [hashiverse/hashiverse](https://github.com/hashiverse/hashiverse).
          > Do not edit or fork this repository — any changes will be overwritten on the next build.
          EOF

      - name: Write version.json to dist
        run: |
          cat > hashiverse-client-web/dist/version.json <<EOF
          {
            "tag": "${{ github.event.release.tag_name }}",
            "commit": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "prerelease": ${{ github.event.release.prerelease }}
          }
          EOF

      - name: Deploy release to hashiverse/app
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.HASHIVERSE_DEPLOY_TOKEN }}
          external_repository: hashiverse/app
          publish_branch: main
          publish_dir: ./hashiverse-client-web/dist
          cname: app.hashiverse.com
          force_orphan: true
          commit_message: Deploy ${{ github.event.release.tag_name }}

      - name: Deploy prerelease to hashiverse/app-prerelease
        if: github.event_name == 'release' && github.event.release.prerelease
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.HASHIVERSE_DEPLOY_TOKEN }}
          external_repository: hashiverse/app-prerelease
          publish_branch: main
          publish_dir: ./hashiverse-client-web/dist
          cname: app-prerelease.hashiverse.com
          force_orphan: true
          commit_message: Deploy ${{ github.event.release.tag_name }}
